
# Application Name
spring.application.name=UniversityManagementSystemMaven

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/university_db}
spring.datasource.username=${DB_USERNAME:university_user}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Configuration
server.port=8081

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=university-management-system
app.jwt.expiration-minutes=30

# Initial administrator setup
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}